# Integration pipeline: the explicit-types guard, build, the format check, test and a packaging check on develop and
# pull requests (no publish).
name: Develop

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  CONFIGURATION: Release
  SOLUTION: shared-net.slnx

permissions:
  contents: read

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
      - name: Convention guard — explicit types
        # The .editorconfig can't flag target-typed new()/implicit new[] (the analyzer never reports the
        # implicit form), so they drift silently. This grep fails the build if any reappear — spell the type out.
        run: |
          if grep -rnE '\bnew\(|new\[\]' --include='*.cs' --exclude-dir=obj --exclude-dir=bin src test | grep -vE ': new\(\)'; then
            echo "::error::Target-typed 'new(' or implicit 'new[]' found — the convention requires explicit types (write 'new Type(...)'). See AGENTS.md."
            exit 1
          fi
      - name: Convention guard — no collection expressions
        # Nor does it flag a collection expression (prefer_collection_expression = false only stops the IDE from
        # offering one). code-style-net's pattern: attributes, indexers, array types and list patterns never match it.
        run: |
          if grep -rnE '(=|=>|return|\(|,)[[:space:]]*\[[^]]*\][[:space:]]*[;,)]|(=|=>|return)[[:space:]]*\[[[:space:]]*$|^[[:space:]]*\[[[:space:]]*$' --include='*.cs' --exclude-dir=obj --exclude-dir=bin src test; then
            echo "::error::Collection expression '[…]' found — the convention requires an explicit collection (write 'new List<T>()', 'Array.Empty<T>()'). See AGENTS.md."
            exit 1
          fi
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }}
      - name: Format
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes --no-restore
      - name: Test
        run: dotnet test ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }} --no-build
      - name: Pack
        run: dotnet pack ${{ env.SOLUTION }} -c ${{ env.CONFIGURATION }} --no-build -o nuget
